max_iterations: 400
checkpoint_interval: 5
log_level: INFO
language: swift
file_suffix: .swift
diff_based_evolution: true
max_code_length: 20000
enforce_evolve_blocks: true
llm:
  api_base: http://127.0.0.1:8765/v1
  api_key: unused
  models:
    - name: gpt-6.2-sol
      weight: 1.0
  temperature: 0.7
  max_tokens: 8000
  timeout: 320
  retries: 1
prompt:
  system_message: |
    You optimise a Swift function for speed. Delegation.lines(in:) scans the head of a Claude Code transcript (JSON lines,
    often tens of megabytes, lines up to hundreds of kilobytes) and returns the lines containing any of ten fixed ASCII marks.
    It must return exactly the same lines (byte for byte, as Data) in the same order as the original for any input:
    split on newline bytes, empty lines dropped, a line kept when it contains at least one mark. The signature
    lines(in:) -> [Data] must stay. No global or static mutable state, no caches between calls, no threads or concurrency.
    Score = speedup over the original, measured with swiftc -O on a 20 MB transcript where only a few lines match.
    Ideas: scan the bytes once with withUnsafeBytes instead of splitting into slices first, search for the marks over the
    whole buffer and map hits back to their line, use a first-byte or memchr/memmem prefilter, avoid copying non-matching lines.
database:
  population_size: 60
  num_islands: 2
  archive_size: 20
evaluator:
  timeout: 300
  cascade_evaluation: false
  parallel_evaluations: 3
