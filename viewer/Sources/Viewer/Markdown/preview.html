<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src viewer-markdown: https: http: data:; style-src viewer-markdown: 'unsafe-inline'; script-src viewer-markdown:; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="viewer-markdown://assets/github-markdown.css">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; background: #fff; }
    .markdown-body { box-sizing: border-box; min-width: 0; max-width: 980px; margin: auto; padding: 32px; overflow-wrap: anywhere; }
    .markdown-body img { height: auto; }
    @media (prefers-color-scheme: dark) { body { background: #0d1117; } }
    @media (max-width: 600px) { .markdown-body { padding: 20px; } }
  </style>
  <script src="viewer-markdown://assets/marked.js"></script>
  <script src="viewer-markdown://assets/purify.js"></script>
  <script src="viewer-markdown://assets/preview.js"></script>
  <title>Markdown preview</title>
</head>
<body><article class="markdown-body" id="content"></article></body>
</html>
