<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>one-text</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <div class="drag" data-tauri-drag-region></div>
  <input id="search" placeholder="Search" spellcheck="false" autocomplete="off">
  <div id="banner" hidden></div>
  <div class="scroll" id="list">
    <div class="inner">
      <div class="sel"></div>
      <div id="people"></div>
      <button class="sect" id="groups-toggle"><span>Groups</span><svg class="chev" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3"/></svg></button>
      <div id="groups-clip"><div id="groups"></div></div>
    </div>
  </div>
</aside>
<main>
  <header data-tauri-drag-region>
    <div class="who" data-tauri-drag-region></div>
    <div class="chips"></div>
    <button class="more" title="More" hidden><svg viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg></button>
  </header>
  <div class="scroll" id="msgs"><div id="thread"></div></div>
  <footer hidden>
    <textarea id="input" rows="1" placeholder="Message" spellcheck="true"></textarea>
    <button class="send" id="send" title="Send"><svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg></button>
  </footer>
  <div id="empty">Select a conversation</div>
</main>
<script src="app.js"></script>
</body>
</html>
