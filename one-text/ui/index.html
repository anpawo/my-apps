<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One Text</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <div class="resize" title="Drag to resize"></div>
  <div class="drag" data-tauri-drag-region></div>
  <div id="banner" hidden></div>
  <div id="favs" class="strip" hidden></div>
  <div id="tabbox" hidden></div>
  <div class="scroll" id="list">
    <div class="inner">
      <div class="sel"></div>
      <div id="pinned"></div>
      <div id="people"></div>
    </div>
  </div>
  <div id="update"><div><span class="words"></span><div class="bar"><i></i></div></div></div>
</aside>
<main>
  <header data-tauri-drag-region>
    <div class="who" data-tauri-drag-region></div>
    <div class="chips"></div>
    <button class="more" title="More" hidden><svg viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg></button>
  </header>
  <div id="find" hidden><input placeholder="Find in this conversation" spellcheck="false" autocomplete="off"><span class="count"></span></div>
  <div class="scroll" id="msgs"><div id="thread"></div></div>
  <div id="emoji" class="menu" hidden></div>
  <div id="picker" class="menu" hidden><input placeholder="Search emoji" spellcheck="false" autocomplete="off"><div class="grid"></div></div>
  <div id="reply" hidden></div>
  <footer hidden>
    <textarea id="input" rows="1" placeholder="Message" spellcheck="true"></textarea>
    <button class="send mic" id="mic" title="Record a voice message"><svg viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/></svg></button>
    <button class="send" id="send" title="Send"><svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg></button>
  </footer>
  <div id="empty">Select a conversation</div>
  <div id="profile" hidden><div class="sheet"><button class="close" title="Close (esc)"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button><div class="body"></div></div></div>
</main>
<div id="palette" hidden><div class="box"><input id="search" placeholder="Search people and groups (/discord, /whatsapp…)" spellcheck="false" autocomplete="off"><div class="scroll" id="results"></div></div></div>
<script src="app.js"></script>
</body>
</html>
