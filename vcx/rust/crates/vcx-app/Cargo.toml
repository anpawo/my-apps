[package]
name = "vcx-app"
description = "The VCX application in Rust: many session windows in one process, their workers, the window list, Fleet presence and the command line"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "vcx-rust"
path = "src/main.rs"

[dependencies]
block2.workspace = true
jiff = "0.2"
libc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSAlert", "NSAppearance", "NSApplication", "NSButton", "NSColor", "NSControl", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSScreen", "NSView", "NSWindow", "block2", "libc"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSBundle", "NSDictionary", "NSDistributedNotificationCenter", "NSGeometry", "NSNotification", "NSOperation", "NSString", "NSURL", "NSValue", "block2"] }
serde_json.workspace = true
tao.workspace = true
tokio = { version = "1", features = ["rt", "time"] }
uuid.workspace = true
vcx-agents = { path = "../vcx-agents" }
vcx-cli = { path = "../vcx-cli" }
vcx-config = { path = "../vcx-config" }
vcx-model.workspace = true
vcx-proto.workspace = true
vcx-shell = { path = "../vcx-shell" }
wry.workspace = true

[dev-dependencies]
vcx-testkit.workspace = true
