[package]
name = "vcx-worker"
description = "The VCX runtime worker: serves protocol v1, runs each session's agent, checkpoints and reopens sessions cold"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
jiff = "0.2"
libc.workspace = true
serde_json.workspace = true
uuid.workspace = true
vcx-agents = { path = "../vcx-agents" }
vcx-config = { path = "../vcx-config" }
vcx-model.workspace = true
vcx-proto.workspace = true
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "process", "io-util", "sync", "time", "signal"] }

[dev-dependencies]
vcx-conformance = { path = "../vcx-conformance" }
vcx-model.workspace = true
vcx-proto.workspace = true
vcx-testkit.workspace = true
