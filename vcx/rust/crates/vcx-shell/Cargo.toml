[package]
name = "vcx-shell"
description = "The VCX window: tao for the window, wry for the system web view that draws the template"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "vcx-shell"
path = "src/main.rs"

[[test]]
name = "charts"
harness = false

[[test]]
name = "composer"
harness = false

[[test]]
name = "chrome"
harness = false

[dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSPasteboard"] }
objc2-foundation = { workspace = true, features = ["NSRunLoop"] }
objc2-web-kit.workspace = true
notify.workspace = true
serde_json.workspace = true
tao.workspace = true
uuid.workspace = true
vcx-model.workspace = true
vcx-proto.workspace = true
wry.workspace = true

[dev-dependencies]
vcx-testkit.workspace = true
