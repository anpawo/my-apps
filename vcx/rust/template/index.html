<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' vcx:; style-src 'self' vcx:; img-src 'self' vcx: data:">
<title>VCX</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="chrome.css">
</head>
<body>
<main id="transcript">
  <p id="empty">A clear space to build.</p>
  <div id="rows" aria-live="polite"></div>
</main>
<footer>
  <div id="status"><span id="dot"></span><span id="status-text">Starting</span></div>
  <p id="notice" role="status" hidden></p>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Ask anything · / commands…" aria-label="Message"></textarea>
    <button type="button" id="stop" aria-label="Stop" hidden></button>
    <button type="submit" id="send" aria-label="Send"></button>
  </form>
  <div id="chips"></div>
</footer>
<script src="app.js"></script>
<script src="chrome.js"></script>
</body>
</html>
