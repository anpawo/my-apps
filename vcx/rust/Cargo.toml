[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
libc = "0.2"
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tao = "0.38"
wry = "0.58"
notify = "8"
uuid = { version = "1", features = ["v4"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSEvent", "NSGraphicsContext", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSData", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSProcessInfo", "NSRange", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }
vcx-proto = { path = "crates/vcx-proto" }
vcx-model = { path = "crates/vcx-model" }
vcx-testkit = { path = "crates/vcx-testkit" }

[profile.release]
lto = "thin"
strip = true
