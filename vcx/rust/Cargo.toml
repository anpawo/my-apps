[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
libc = "0.2"
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tao = "0.38"
wry = "0.58"
notify = "8"
vcx-proto = { path = "crates/vcx-proto" }
vcx-model = { path = "crates/vcx-model" }

[profile.release]
lto = "thin"
strip = true
